from: markdown
to: pdf
output-file: "Progress and Poverty.pdf"
pdf-engine: xelatex
input-files:
  - "Introductory/Introductory Epigraph.md"
  - "Introductory/Introductory.md"
  - "Book 1/Book 1.md"
  - "Book 1/Chapter 1.md"
  - "Book 1/Chapter 2.md"
  - "Book 1/Chapter 3.md"
  - "Book 2/Book 2.md"
  - "Book 3/Book 3.md"
  - "Book 4/Book 4.md"
  - "Book 5/Book 5.md"
  - "Book 6/Book 6.md"
  - "Book 7/Book 7.md"
  - "Book 8/Book 8.md"
  - "Book 9/Book 9.md"
  - "Book 10/Book 10.md"
toc: true
number-sections: false
metadata:
  title: "Progress and Poverty"
  author: "Henry George"
include-in-header:
  - "Tex/chapters.tex"
  - "Tex/epigraph.tex"
  - "Tex/headings.tex"
  - "Tex/minitoc.tex"
  - "Tex/quotes.tex"
include-before-body:
  - "Tex/minitoc-init.tex"
variables:
  documentclass: book
  geometry:
    - paperwidth=5.5in
    - paperheight=8.5in
    - inner=1.0in
    - outer=0.5in
    - twoside
  linestretch: 1
  colorlinks: true
  indent: true
  fontsize: 12
  toc-depth: 2
resource-path:
  - .
